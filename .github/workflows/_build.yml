name: _build

# ============================================================
# 可复用编译工作流（被 build-lede.yml / build-immortalwrt.yml 调用）
# 通过 inputs 参数化源码、缓存前缀、超时、是否预编译 toolchain
# ============================================================
on:
  workflow_call:
    inputs:
      source:
        description: "源码标识：lede | immortalwrt（同时作为克隆目录名）"
        required: true
        type: string
      repo_url:
        description: "源码 git 仓库地址"
        required: true
        type: string
      key_prefix:
        description: "缓存 key 前缀，如 lede / iwrt"
        required: true
        type: string
      timeout_minutes:
        description: "单设备编译超时（分钟）"
        required: false
        type: number
        default: 360
      build_toolchain:
        description: "是否在编译前单独预编译 toolchain（ImmortalWrt 需要）"
        required: false
        type: boolean
        default: false

jobs:
  build:
    name: "${{ inputs.source }} · ${{ matrix.device }}"
    runs-on: ubuntu-22.04
    timeout-minutes: ${{ inputs.timeout_minutes }}

    strategy:
      fail-fast: false
      matrix:
        device:
          - xiaomi-ax3600
          - xiaomi-ax9000
          - xiaomi-wr30u
          - xiaomi-ax6000
          - redmi-ax6000
          - phicomm-k2p
          - xiaomi-3g
          - xiaomi-cr660x
          - r2s
          - x86_64
          - raspberrypi-4b

    steps:
      # ── 检出仓库 ──────────────────────────────────────────
      - name: Checkout builder repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ── 释放磁盘空间 ──────────────────────────────────────
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/powershell /usr/share/swift \
                      /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force 2>/dev/null || true
          sudo apt-get autoremove -y --purge 2>/dev/null || true
          df -h

      # ── 安装构建依赖 ──────────────────────────────────────
      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib \
            gettext git libncurses-dev libssl-dev python3-distutils \
            rsync unzip zlib1g-dev file wget curl tar \
            libelf-dev libfuse-dev libc6-dev-i386 lib32gcc-s1 \
            ccache swig

      # ── 克隆源码 ──────────────────────────────────────────
      - name: Clone ${{ inputs.source }} source
        run: |
          git clone --depth 1 \
            -c http.postBuffer=524288000 \
            -c http.lowSpeedLimit=1000 \
            -c http.lowSpeedTime=60 \
            "${{ inputs.repo_url }}" "${{ inputs.source }}"

      # ── feeds 缓存 ────────────────────────────────────────
      - name: Cache feeds
        uses: actions/cache@v4
        with:
          path: ${{ inputs.source }}/feeds
          key: ${{ inputs.key_prefix }}-feeds-${{ hashFiles(format('{0}/feeds.conf.default', inputs.source), 'scripts/setup-custom-packages.sh') }}-${{ github.run_id }}
          restore-keys: |
            ${{ inputs.key_prefix }}-feeds-${{ hashFiles(format('{0}/feeds.conf.default', inputs.source), 'scripts/setup-custom-packages.sh') }}-
            ${{ inputs.key_prefix }}-feeds-

      # ── dl/ 缓存 ──────────────────────────────────────────
      - name: Cache downloads
        uses: actions/cache@v4
        with:
          path: ${{ inputs.source }}/dl
          key: ${{ inputs.key_prefix }}-dl-${{ matrix.device }}-${{ github.run_id }}
          restore-keys: |
            ${{ inputs.key_prefix }}-dl-${{ matrix.device }}-
            ${{ inputs.key_prefix }}-dl-

      # ── ccache ────────────────────────────────────────────
      - name: Setup ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ${{ inputs.key_prefix }}-ccache-${{ matrix.device }}-${{ github.run_id }}
          restore-keys: |
            ${{ inputs.key_prefix }}-ccache-${{ matrix.device }}-
            ${{ inputs.key_prefix }}-ccache-

      - name: Configure ccache
        run: |
          ccache --max-size=2G
          echo "CCACHE_DIR=$HOME/.ccache" >> "$GITHUB_ENV"
          echo "USE_CCACHE=1" >> "$GITHUB_ENV"

      # ── 预编译 toolchain（可选，ImmortalWrt 需要）────────
      - name: Cache toolchain
        if: ${{ inputs.build_toolchain }}
        uses: actions/cache@v4
        with:
          path: ${{ inputs.source }}/staging_dir/toolchain-*
          key: ${{ inputs.key_prefix }}-toolchain-${{ matrix.device }}-${{ github.run_id }}
          restore-keys: |
            ${{ inputs.key_prefix }}-toolchain-${{ matrix.device }}-
            ${{ inputs.key_prefix }}-toolchain-

      - name: Build toolchain (if not cached)
        if: ${{ inputs.build_toolchain }}
        working-directory: ${{ inputs.source }}
        run: |
          # 仅在 toolchain 不存在时编译（缓存命中时跳过）
          if [ -z "$(ls staging_dir/toolchain-* 2>/dev/null)" ]; then
            echo "Toolchain not cached, building..."
            make toolchain/compile -j$(nproc) || make toolchain/compile -j1 V=s 2>&1 | tail -100
          else
            echo "Toolchain already cached, skipping."
          fi

      # ── 配置 feeds + 自定义包 ─────────────────────────────
      - name: Setup custom feeds and packages
        working-directory: ${{ inputs.source }}
        run: bash "$GITHUB_WORKSPACE/scripts/setup-custom-packages.sh" "${{ inputs.source }}"

      # ── 安装 oh-my-bash overlay ───────────────────────────
      - name: Install oh-my-bash overlay
        working-directory: ${{ inputs.source }}
        run: bash "$GITHUB_WORKSPACE/scripts/install-files-overlay.sh"

      # ── 生成 SSH banner ───────────────────────────────────
      - name: Generate SSH banner
        working-directory: ${{ inputs.source }}
        run: bash "$GITHUB_WORKSPACE/scripts/generate-banner.sh" "${{ inputs.source }}"

      # ── 合并 .config ──────────────────────────────────────
      - name: Merge config files
        working-directory: ${{ inputs.source }}
        run: |
          # 合并公共配置 + 设备特定配置
          cat "$GITHUB_WORKSPACE/configs/${{ inputs.source }}/common.config" > .config
          cat "$GITHUB_WORKSPACE/configs/${{ inputs.source }}/${{ matrix.device }}.config" >> .config
          # 首次 defconfig（不含 TurboACC，避免循环依赖）
          make defconfig

      # ── 注入 TurboACC（defconfig 之后）───────────────────
      - name: Inject TurboACC after defconfig
        working-directory: ${{ inputs.source }}
        run: |
          cat "$GITHUB_WORKSPACE/configs/custom-plugins.config" >> .config
          make oldconfig < /dev/null || true

      # ── 下载软件包 ────────────────────────────────────────
      - name: Download packages
        working-directory: ${{ inputs.source }}
        run: |
          make download -j$(nproc) 2>&1 | tee /tmp/download.log
          # 检查失败项（不中断，因为可选包可能 404）
          grep "ERROR\|error\|failed" /tmp/download.log | grep -v "^make" || true

      # ── 编译固件 ──────────────────────────────────────────
      - name: Build firmware
        working-directory: ${{ inputs.source }}
        run: |
          echo "Building ${{ matrix.device }}..."
          make -j$(nproc) || make -j1 V=s 2>&1 | tail -200

      # ── 打包固件 ──────────────────────────────────────────
      - name: Pack firmware
        working-directory: ${{ inputs.source }}
        run: bash "$GITHUB_WORKSPACE/scripts/pack-firmware.sh" "${{ inputs.source }}" "${{ matrix.device }}"

      # ── 上传 artifacts（供 release 任务汇总）──────────────
      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.source }}-${{ matrix.device }}
          path: ${{ github.workspace }}/firmware-output/
          retention-days: 7
          if-no-files-found: warn

  # ============================================================
  # 汇总发布：所有设备编译完成后只创建一个 Release
  # 避免 11 个 matrix 任务并发写同一 tag 造成竞态
  # ============================================================
  release:
    name: "${{ inputs.source }} · release"
    needs: build
    if: ${{ !cancelled() && needs.build.result != 'skipped' }}
    runs-on: ubuntu-22.04
    steps:
      - name: Download all firmware artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: ${{ inputs.source }}-*
          path: firmware-output
          merge-multiple: true

      - name: List collected firmware
        run: |
          if [ -z "$(ls -A firmware-output 2>/dev/null)" ]; then
            echo "没有任何固件产物，跳过发布。"
            echo "HAS_FILES=false" >> "$GITHUB_ENV"
          else
            ls -lh firmware-output
            echo "HAS_FILES=true" >> "$GITHUB_ENV"
          fi

      - name: Create release
        if: ${{ env.HAS_FILES == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.source }}-${{ github.run_number }}
          name: "${{ inputs.source }} Build #${{ github.run_number }}"
          body: |
            ${{ inputs.source }} 固件 — 构建 #${{ github.run_number }}

            构建时间：${{ github.event.head_commit.timestamp || github.run_id }}
            提交：${{ github.sha }}

            **预装插件**：PassWall · MosDNS · TurboACC · TTYD · ARP绑定 · Aurora主题
          files: firmware-output/*
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
